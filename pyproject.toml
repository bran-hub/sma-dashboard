[project]
name = "sma-dashboard"
version = "0.3.0"
description = "Privacy-first SMA oversight dashboard with reproducible CAD performance analytics."
requires-python = ">=3.11"
dependencies = [
    "altair>=5.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "streamlit>=1.36.0",
    "yfinance>=0.2.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[project.optional-dependencies]
chatbot = [
    "anthropic>=0.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["sma_dashboard*"]

[tool.setuptools.package-data]
sma_dashboard = ["schema.sql"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
