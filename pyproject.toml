[project]
name = "sma-dashboard"
version = "0.1.0"
description = "Local SMA oversight dashboard data foundation."
requires-python = ">=3.11"
dependencies = [
    "altair>=5.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "streamlit>=1.36.0",
    "yfinance>=0.2.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
